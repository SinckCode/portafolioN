<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .glass-card {
            background-color: rgba(15, 17, 21, 0.5); /* Matching #0f111580 from style guide */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid theme('colors.outline-variant');
        }
        
        .glass-card:hover {
            border-color: theme('colors.primary-container');
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.25);
        }

        .input-field {
            background-color: #1a1c22;
            border: 1px solid theme('colors.outline-variant');
            color: theme('colors.on-surface');
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: theme('colors.primary-container');
            box-shadow: 0 0 0 2px rgba(0, 180, 216, 0.125); /* #00b4d820 */
        }
        
        .btn-primary {
            background-color: theme('colors.primary-container');
            color: black;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.25);
            transform: scale(1.02);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid theme('colors.primary-container');
            color: theme('colors.primary-container');
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background-color: theme('colors.primary-container');
            color: black;
        }
        
        .cyber-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(42, 45, 53, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(42, 45, 53, 0.2) 1px, transparent 1px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop cyber-grid relative overflow-hidden">
<!-- Background Decor elements -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary-container opacity-[0.03] blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] rounded-full bg-primary-container opacity-[0.03] blur-[80px]"></div>
<main class="w-full max-w-[480px] z-10">
<!-- Header / Logo Area -->
<div class="text-center mb-8">
<h1 class="font-h2 text-h2 text-primary font-extrabold tracking-tight mb-2 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">terminal</span>
                AO
            </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">System Authentication Gateway</p>
</div>
<!-- Glassmorphism Card -->
<div class="glass-card rounded-xl p-8 transition-all duration-300">
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label text-label text-on-surface uppercase block" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
<input class="input-field w-full rounded-lg py-3 pl-10 pr-4 font-body-sm text-body-sm" id="email" placeholder="operator@system.io" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label text-label text-on-surface uppercase block" for="password">Password</label>
<a class="font-body-sm text-[12px] text-primary hover:text-primary-fixed transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
<input class="input-field w-full rounded-lg py-3 pl-10 pr-4 font-body-sm text-body-sm" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="btn-primary w-full py-3 rounded-lg font-label text-label uppercase flex justify-center items-center gap-2 mt-4" type="submit">
                    Authenticate
                    <span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<div class="mt-8 mb-6 flex items-center gap-4">
<div class="h-[1px] bg-outline-variant flex-1"></div>
<span class="font-label text-[10px] text-on-surface-variant uppercase">Or initialize via</span>
<div class="h-[1px] bg-outline-variant flex-1"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="bg-[#161b22] hover:bg-[#21262d] border border-outline-variant text-on-surface py-2.5 rounded-lg font-body-sm text-body-sm flex items-center justify-center gap-2 transition-colors">
<!-- SVG GitHub Icon placeholder -->
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"></path></svg>
                    GitHub
                </button>
<button class="bg-white hover:bg-gray-100 text-black py-2.5 rounded-lg font-body-sm text-body-sm flex items-center justify-center gap-2 transition-colors border border-white">
<!-- SVG Google Icon placeholder -->
<svg class="w-5 h-5" viewbox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path><path d="M1 1h22v22H1z" fill="none"></path></svg>
                    Google
                </button>
</div>
<div class="mt-8 text-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">Unregistered entity?</span>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-fixed ml-1 transition-colors" href="#">Request Access</a>
</div>
</div>
</main>
</body></html>
