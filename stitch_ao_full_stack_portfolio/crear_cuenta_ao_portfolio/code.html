<style>
        /* Cyberpunk Glows and Utilities */
        .glow-cyan {
            box-shadow: 0 0 15px #00b4d840;
        }
        .glow-cyan-hover:hover {
            box-shadow: 0 0 15px #00b4d840;
        }
        .glass-panel {
            background-color: #0f111580;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        
        /* Custom Checkbox */
        .cyber-checkbox:checked {
            background-color: #00b4d8;
            border-color: #00b4d8;
        }
        
        /* Background Pattern */
        .bg-cyber-grid {
            background-image: 
                linear-gradient(to right, rgba(42, 45, 53, 0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(42, 45, 53, 0.3) 1px, transparent 1px);
            background-size: 40px 40px;

<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body text-body relative overflow-hidden bg-cyber-grid">
<!-- Abstract Tech Elements Background -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0 flex items-center justify-center opacity-30">
<div class="w-96 h-96 bg-primary-container rounded-full blur-[120px] mix-blend-screen absolute -top-20 -left-20"></div>
<div class="w-96 h-96 bg-secondary-container rounded-full blur-[120px] mix-blend-screen absolute bottom-0 right-0"></div>
</div>
<!-- Registration Card -->
<main class="w-full max-w-[500px] px-margin-mobile md:px-0 z-10 relative mt-12 mb-12">
<div class="glass-panel border border-outline-variant rounded-xl p-8 md:p-10 shadow-lg relative overflow-hidden group">
<!-- Hover Tech Line Top -->
<div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700"></div>
<div class="text-center mb-10">
<div class="inline-block mb-4 p-3 bg-surface-container rounded-xl border border-outline-variant glow-cyan">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">how_to_reg</span>
</div>
<h1 class="font-h2 text-h2 text-primary font-bold mb-2">Create Account</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Initialize your access sequence.</p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label text-label text-on-surface-variant mb-2" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-[#1a1c22] border border-[#2a2d35] rounded-lg text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all duration-300 font-body-sm text-body-sm" id="fullName" name="fullName" placeholder="John Doe" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="block font-label text-label text-on-surface-variant mb-2" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-[#1a1c22] border border-[#2a2d35] rounded-lg text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all duration-300 font-body-sm text-body-sm" id="email" name="email" placeholder="you@domain.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label text-label text-on-surface-variant mb-2" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 bg-[#1a1c22] border border-[#2a2d35] rounded-lg text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all duration-300 font-body-sm text-body-sm" id="password" name="password" oninput="updateStrength(this.value)" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<!-- Password Strength Meter -->
<div class="mt-3">
<div class="flex justify-between font-label text-[10px] mb-1">
<span class="text-on-surface-variant">Security Level:</span>
<span class="text-error" id="strength-text">Weak</span>
</div>
<div class="h-1.5 w-full bg-[#1a1c22] rounded-full overflow-hidden flex gap-1">
<div class="h-full w-1/3 bg-error transition-all duration-300" id="bar-1"></div>
<div class="h-full w-1/3 bg-transparent transition-all duration-300" id="bar-2"></div>
<div class="h-full w-1/3 bg-transparent transition-all duration-300" id="bar-3"></div>
</div>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label text-label text-on-surface-variant mb-2" for="confirmPassword">Confirm Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock_reset</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-[#1a1c22] border border-[#2a2d35] rounded-lg text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all duration-300 font-body-sm text-body-sm" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Checkboxes -->
<div class="space-y-3 pt-2">
<div class="flex items-start">
<div class="flex items-center h-5">
<input class="cyber-checkbox w-4 h-4 bg-[#1a1c22] border-[#2a2d35] rounded focus:ring-primary-container focus:ring-2 focus:ring-offset-0 transition-colors" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">I agree to the <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.</label>
</div>
</div>
<div class="flex items-start">
<div class="flex items-center h-5">
<input class="cyber-checkbox w-4 h-4 bg-[#1a1c22] border-[#2a2d35] rounded focus:ring-primary-container focus:ring-2 focus:ring-offset-0 transition-colors" id="newsletter" name="newsletter" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="newsletter">Subscribe to system updates and technical newsletters.</label>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg text-background bg-primary-container font-label text-label hover:scale-102 glow-cyan-hover transition-all duration-300 mt-6" type="submit">
<span class="material-symbols-outlined mr-2 text-sm">terminal</span>
                    EXECUTE_REGISTRATION
                </button>
</form>
<div class="mt-8 text-center border-t border-outline-variant pt-6">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    System access already verified? 
                    <a class="text-primary font-bold hover:underline inline-flex items-center ml-1" href="#">
                        Login here <span class="material-symbols-outlined text-sm ml-1">arrow_forward</span>
</a>
</p>
</div>
</div>
</main>
<script>
        // Simple client-side password strength meter logic for demonstration
        function updateStrength(password) {
            const bar1 = document.getElementById('bar-1');
            const bar2 = document.getElementById('bar-2');
            const bar3 = document.getElementById('bar-3');
            const strengthText = document.getElementById('strength-text');
            
            let strength = 0;
            if (password.length > 5) strength += 1;
            if (password.length > 8 && password.match(/[a-zA-Z]/) && password.match(/[0-9]/)) strength += 1;
            if (password.length > 10 && password.match(/[^a-zA-Z0-9]/)) strength += 1;

            // Reset
            bar1.className = 'h-full w-1/3 transition-all duration-300 bg-surface-container-highest';
            bar2.className = 'h-full w-1/3 transition-all duration-300 bg-surface-container-highest';
            bar3.className = 'h-full w-1/3 transition-all duration-300 bg-surface-container-highest';

            if (password.length === 0) {
                strengthText.textContent = "Required";
                strengthText.className = "text-on-surface-variant";
                return;
            }

            if (strength === 0 || strength === 1) {
                bar1.className = 'h-full w-1/3 transition-all duration-300 bg-error';
                strengthText.textContent = "Weak";
                strengthText.className = "text-error";
            } else if (strength === 2) {
                bar1.className = 'h-full w-1/3 transition-all duration-300 bg-tertiary-container';
                bar2.className = 'h-full w-1/3 transition-all duration-300 bg-tertiary-container';
                strengthText.textContent = "Moderate";
                strengthText.className = "text-tertiary-container";
            } else {
                bar1.className = 'h-full w-1/3 transition-all duration-300 bg-primary-container';
                bar2.className = 'h-full w-1/3 transition-all duration-300 bg-primary-container';
                bar3.className = 'h-full w-1/3 transition-all duration-300 bg-primary-container';
                strengthText.textContent = "Strong";
                strengthText.className = "text-primary-container";
            }
        }
    </script>
</body></html>
