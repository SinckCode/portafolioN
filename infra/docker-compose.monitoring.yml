services:
  redis:
    image: redis:7-alpine
    container_name: portfolio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      logging: "promtail"

  loki:
    image: grafana/loki:3.0.0
    container_name: portfolio-loki
    restart: unless-stopped
    user: root # el volumen loki_data lo crea root; Loki 3 corre como uid 10001 y no puede escribir
    ports:
      - "3100:3100"
    volumes:
      - ../infra/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/config.yml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:3.0.0
    container_name: portfolio-promtail
    restart: unless-stopped
    volumes:
      - ../infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/onesto/.pm2/logs:/home/onesto/.pm2/logs:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy

  # --- Métricas ---
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: portfolio-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      logging: "promtail"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: portfolio-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: portfolio-mongodb-exporter
    restart: unless-stopped
    command:
      - --mongodb.uri=${MONGO_EXPORTER_URI}
      - --collect-all
      - --compatible-mode

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: portfolio-blackbox-exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: portfolio-grafana
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.angelonesto.com
      # Alertas por correo vía el relay de Brevo.
      #
      # Antes apuntaba al mail-server interno (VM102:25) y ninguna alerta salía:
      # Postfix rechazaba el relay hacia dominios externos desde este cliente
      # (454 4.7.1 Relay access denied). Se acumularon 1,036 rechazos en tres
      # días sin que nada lo reportara — que es justo el problema de tener las
      # alertas rotas: el fallo se esconde a sí mismo.
      #
      # Las credenciales viven en infra/.env (ignorado por git), no aquí.
      # FROM_ADDRESS tiene que ser un remitente verificado en Brevo: el usuario
      # SMTP es la credencial de acceso y usarlo como remitente hace que el
      # relay rechace el mensaje.
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp-relay.brevo.com:587
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASS}
      - GF_SMTP_FROM_ADDRESS=${MAIL_FROM:-contacto@angelonesto.com}
      - GF_SMTP_FROM_NAME=Grafana Portfolio
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
    volumes:
      - ../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    labels:
      logging: "promtail"

volumes:
  redis_data:
  loki_data:
  grafana_data:
  prometheus_data:
