apiVersion: 1

groups:
  - orgId: 1
    name: Portfolio-Criticas
    folder: Portfolio Alerts
    interval: 1m
    rules:
      # --- Sitio caído ---
      - uid: alert-site-down
        title: Sitio caído — angelonesto.com
        condition: C
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: angelonesto.com no responde (probe_success < 1)
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'probe_success{instance="https://angelonesto.com"}'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # --- API caída ---
      - uid: alert-api-down
        title: API caída — api.angelonesto.com
        condition: C
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: api.angelonesto.com/health no responde
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'probe_success{instance="https://api.angelonesto.com/api/health"}'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # --- MongoDB caído ---
      - uid: alert-mongo-down
        title: MongoDB caído — VM101
        condition: C
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: mongodb_up < 1 en 10.10.30.101
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'mongodb_up'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # --- Disco lleno (cualquier VM) ---
      - uid: alert-disk-full
        title: Disco > 85% — apps o mongo
        condition: C
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Espacio libre en / por debajo de 15% en {{ $labels.instance }}
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: '(node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.15] }

      # --- RAM alta VM100 ---
      - uid: alert-mem-high
        title: RAM disponible < 10% — VM100
        condition: C
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Memoria disponible por debajo de 10% en apps
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: '(node_memory_MemAvailable_bytes{instance="vm100-apps"} / node_memory_MemTotal_bytes{instance="vm100-apps"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.10] }
