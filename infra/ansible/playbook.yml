---
- name: Setup Portfolio Server
  hosts: app_servers
  become: true
  vars:
    node_major: "20"

  roles:
    - docker
    - cloudflared
    - app

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Node.js {{ node_major }}
      block:
        - name: Add NodeSource GPG key
          shell: curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
          args:
            creates: /usr/share/keyrings/nodesource.gpg

        - name: Add NodeSource repository
          apt_repository:
            repo: "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main"
            state: present

        - name: Install Node.js
          apt:
            name: nodejs
            state: present
            update_cache: yes

    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes
        state: present

    - name: Setup PM2 startup
      shell: pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }}
      args:
        creates: /etc/systemd/system/pm2-{{ app_user }}.service
